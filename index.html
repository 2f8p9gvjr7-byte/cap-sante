<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1730">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cap Santé">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Cap Santé</title>
<style>
:root{
  --bg:#0d1730; --card:#16244a; --card2:#0b1428; --ink:#eef2fb; --muted:#9aa8c7; --line:#26365f;
  --teal:#f5a623; --teal-l:rgba(245,166,35,.16); --good:#3ddc84; --good-l:rgba(61,220,132,.14);
  --bad:#ff5a5f; --bad-l:rgba(255,90,95,.15); --warn:#ffb547; --warn-l:rgba(255,181,71,.14);
  --sucre:#ff8a3d; --chol:#b48cff; --reins:#38c6f4; --on-accent:#13203f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#14234a,#0d1730);color:var(--ink);border-bottom:2px solid var(--teal);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
header h1{margin:0;font-size:22px;color:var(--teal);letter-spacing:.06em;text-transform:uppercase}
header p{margin:2px 0 0;font-size:14px;opacity:.85}
main{padding:12px 12px calc(env(safe-area-inset-bottom) + 90px);max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;background:#0a1226;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:9px 2px 8px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px;line-height:1}
nav button.on{color:var(--teal);font-weight:600}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.card h2{margin:0 0 10px;font-size:18px}
.card h3{margin:14px 0 6px;font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datebar button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-size:22px;color:var(--teal)}
.datebar .d{font-weight:600;text-align:center;flex:1}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .lbl{flex:1}
.row .lbl small{display:block;color:var(--muted);font-size:13px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card2);font-size:22px;line-height:1;color:var(--teal)}
.stepper .v{min-width:44px;text-align:center;font-weight:700;font-size:18px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.quick button,.chip{border:1px solid var(--teal);background:var(--card2);color:var(--teal);border-radius:20px;padding:6px 12px;font-size:15px}
.chips{display:flex;gap:6px}
.chip.on{background:var(--teal);color:var(--on-accent);border-color:var(--teal)}
.tog{width:52px;height:32px;border-radius:16px;border:0;background:#cfd8d6;position:relative;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--card2);transition:left .15s}
.tog.on{background:var(--teal)}
.tog.on::after{left:23px}
.tog.neg.on{background:var(--bad)}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.score{border-radius:12px;padding:10px 6px;text-align:center;background:var(--bg)}
.score b{display:block;font-size:26px}
.score small{font-size:12px;color:var(--muted)}
.verdict{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:12px;margin-top:8px}
.verdict.good{background:var(--good-l);color:var(--good)}
.verdict.bad{background:var(--bad-l);color:var(--bad)}
.verdict.flat{background:var(--warn-l);color:var(--warn)}
.verdict .ic{font-size:24px;line-height:1}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--teal)}
.muted{color:var(--muted);font-size:14px}
.btn{display:block;width:100%;padding:13px;border-radius:12px;border:0;background:var(--teal);color:var(--on-accent);font-size:17px;font-weight:600;margin-top:10px}
.btn.sec{background:var(--card2);color:var(--teal);border:1px solid var(--teal)}
.btn.danger{background:var(--card2);color:var(--bad);border:1px solid var(--bad)}
label.f{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0}
label.f input,label.f select{width:120px;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:17px;text-align:right;background:var(--card2)}
label.f input[type=date]{width:170px;text-align:left}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
.up{color:var(--good);font-weight:700}.down{color:var(--bad);font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:4px;border-radius:2px;margin-right:4px;vertical-align:middle}
#upd{display:none;position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 76px);z-index:10;background:#1f2933;color:#fff;border-radius:14px;padding:12px 14px;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#upd button{margin-left:auto;background:var(--card2);color:#1f2933;border:0;border-radius:10px;padding:8px 12px;font-weight:600;font-size:15px}
.hidden{display:none}
.tip{font-size:14px;background:var(--teal-l);border-radius:10px;padding:10px;margin-top:8px}
.meal h2{display:flex;justify-content:space-between;align-items:center}
.meal h2 small{font-size:14px;color:var(--muted);font-weight:500}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;font:inherit;color:inherit}
.item small{display:block;color:var(--muted);font-size:13px}
.item .k{font-weight:600;white-space:nowrap}
.add{border:1px dashed var(--teal);background:var(--teal-l);color:var(--teal);border-radius:12px;padding:10px;width:100%;font-size:16px;font-weight:600;margin-top:8px}
.nut{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;font-size:15px}
.nut .bar{grid-column:1/3;margin:2px 0 8px}
.nut .bar.over i{background:var(--bad)}
#ov{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column}
#ov.on{display:flex}
#ov .top{display:flex;gap:8px;align-items:center;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;background:var(--card2);border-bottom:1px solid var(--line)}
#ov .top input{flex:1;padding:11px 12px;border-radius:12px;border:1px solid var(--line);font-size:17px;background:var(--bg)}
#ov .top button{border:0;background:none;color:var(--teal);font-size:17px;padding:8px 4px}
#ov .body{flex:1;overflow:auto;padding:4px 12px calc(env(safe-area-inset-bottom) + 20px)}
#ov .cat{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 2px}
.qty{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0}
.qty input{width:110px;font-size:26px;font-weight:700;text-align:center;padding:8px;border:1px solid var(--line);border-radius:12px}
.qty button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--card2);font-size:26px;color:var(--teal)}
.dim{opacity:.45}
.nutbtn{display:block;width:100%;border:0;background:none;padding:0;margin:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.nutbtn .nut{margin:0}
.mrow{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;padding:8px 0;text-align:left;font:inherit;color:inherit}
.bulle{flex:none;width:104px;height:104px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;text-shadow:0 1px 2px rgba(0,0,0,.25);box-shadow:0 6px 16px rgba(0,0,0,.12), inset 0 -6px 12px rgba(0,0,0,.08)}
.bulle .ico{font-size:34px;line-height:1.1;text-shadow:none}
.mtxt{flex:1;min-height:84px;background:rgba(255,255,255,.75);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;justify-content:center}
.mtxt .vide{color:#9aa5ad;font-style:italic}
.mtxt .k{font-weight:700;color:var(--teal);margin-top:4px}
.repasfond{background:linear-gradient(160deg,#e8f1fb 0%,#efe8fb 45%,#e2f8f6 100%);border-radius:18px;padding:6px 12px;margin-bottom:12px}
input,select{color:var(--ink);background:var(--card2);color-scheme:dark}
input::placeholder{color:#6f7da0}
.card h2{color:var(--ink)}
.tip{color:var(--ink)}
.bar{background:#0b1428}
.mtxt{background:rgba(22,36,74,.85)!important;color:var(--ink)}
.repasfond{background:linear-gradient(160deg,#152a57 0%,#1d1f4f 50%,#0f2f45 100%)!important}
.add{background:rgba(245,166,35,.10);border-color:var(--teal);color:var(--teal)}
.tog{background:#33456f}
.ring{display:block;margin:0 auto 4px}
.score{background:var(--card2)!important;border:1px solid var(--line)}
</style>
</head>

const EAU_MAX = 1500;   // au-delà, plus de bonus
function eauMl(x){
  if(x.eauMl!=null) return x.eauMl;
  if(x.eauNiv) return {1:700, 2:1250, 3:1500}[x.eauNiv];   // anciennes saisies
  if(x.p && x.p.eau) return 1500;
  return 0;
}
function eauEffet(ml){
  const obj = S.eau;
  if(ml < obj) return -10*(1 - ml/obj);                       // sous l'objectif : jusqu'à −10
  const plafond = Math.max(EAU_MAX, obj);
  return 5 + (plafond>obj ? 5*Math.min((ml-obj)/(plafond-obj), 1) : 5);  // objectif : +5, jusqu'à +10 à 1,5 L
}

/* ---------- Outils ---------- */
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const today = () => iso(new Date());
const fmt = (n, dec=2) => n==null||isNaN(n) ? "—" : (Math.round(n*10**dec)/10**dec).toLocaleString("fr-FR");
const fmtDate = s => parse(s).toLocaleDateString("fr-FR", {weekday:"long", day:"numeric", month:"long"});
const fmtShort = s => parse(s).toLocaleDateString("fr-FR", {day:"2-digit", month:"2-digit", year:"2-digit"});
const clamp = v => Math.max(0, Math.min(100, Math.round(v)));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function blank(){ return {marche:0, marches:[], med:[], piscine:0, autre:0, repas:[false,false,false], p:{}, m:{}, n:{}, avocat:0, j:{}}; }
function day(s){
  const x = D[s] ? Object.assign(blank(), JSON.parse(JSON.stringify(D[s]))) : blank();
  if(!D[s] || !D[s].marches) x.marches = x.marche ? [{min:x.marche, al:"n"}] : [];
  if(!D[s] || !D[s].med){ x.med = []; if(x.n && x.n.bicarb) x.med.push({id:"bicarb"}); if(x.n && x.n.ains) x.med.push({id:"ains"}); }  // anciennes cases
  if(x.n){ delete x.n.bicarb; delete x.n.ains; }
  return x;
}
/* Marches : durée saisie, sinon distance convertie selon l'allure */
const PACE = {l:20, n:15, r:12};          // minutes par km
const INTENS = {l:0.8, n:1, r:1.2};        // effet sur le score
const ALLURE = {l:"lente", n:"normale", r:"rapide"};
const walkMin = w => w.min>0 ? w.min : Math.round((w.km||0)*PACE[w.al||"n"]);
const walkKm = w => w.km>0 ? w.km : 0;
function syncMarche(x){ x.marche = (x.marches||[]).reduce((t,w)=>t+walkMin(w),0); }
function hasJournal(x){ return !!(x && x.j && Object.values(x.j).some(a => a && a.length)); }
function hasData(x){
  if(!x) return false;
  if(x.marche||x.piscine||x.autre||x.avocat||x.eauNiv||x.eauMl||(x.med&&x.med.length)||(x.marches&&x.marches.length)) return true;
  if((x.repas||[]).some(Boolean)) return true;
  if(hasJournal(x)) return true;
  return [x.p,x.m,x.n].some(o => o && Object.values(o).some(Boolean));
}
function nutr(f, g){ const k = g/100; const r = {}; ["kcal","prot","gluc","suc","fib","lip","ags","sel"].forEach(n => r[n] = f[n]*k); return r; }
/* Ordre des aliments : légumes (fibres) et protéines/graisses mangés AVANT le sucré
   ralentissent l'arrivée du sucre dans le sang (≈ −30 % dans les études, Diabetes Care 2015). */
const ORDRE = {fib:3, pl:10, plein:0.7, demi:0.85};
function mealFactors(items){
  let fib = 0, pl = 0;
  return items.map(it => {
    const f = FOODS[it.f]; if(!f) return 1;
    const fac = (fib>=ORDRE.fib && pl>=ORDRE.pl) ? ORDRE.plein : (fib>=ORDRE.fib || pl>=ORDRE.pl) ? ORDRE.demi : 1;
    const n = nutr(f, it.g); fib += n.fib; pl += n.prot + n.lip;
    return fac;
  });
}
function totals(x, meal){
  const t = {kcal:0, prot:0, gluc:0, suc:0, fib:0, lip:0, ags:0, sel:0, igGluc:0, o3:0, verres:0, sucW:0, igW:0, lib:0, libW:0, by:{suc:{}, lib:{}, ags:{}, sel:{}, ig:{}, kcal:{}, fib:{}, o3:{}, libW:{}, igW:{}, alc:{}}};
  const addBy = (k, name, v) => { if(v>0) t.by[k][name] = (t.by[k][name]||0) + v; };
  const meals = meal ? [meal] : Object.keys(x.j||{});
  meals.forEach(m => { const facs = mealFactors(x.j[m]||[]); (x.j[m]||[]).forEach((it, i) => {
    const f = FOODS[it.f]; if(!f) return;
    const fac = facs[i];
    const n = nutr(f, it.g); for(const k in n) t[k] += n[k];
    if(f.o.ig){ t.igGluc += n.gluc*f.o.ig; t.igW += n.gluc*f.o.ig*fac; }
    t.sucW += n.suc*fac; t.lib += n.suc*f.lib; t.libW += n.suc*f.lib*fac;
    const nm = f.n.replace(/ \(.*\)$/,"").replace(/ \/.*$/,"");
    addBy("suc", nm, n.suc); addBy("lib", nm, n.suc*f.lib); addBy("ags", nm, n.ags); addBy("sel", nm, n.sel); addBy("kcal", nm, n.kcal); if(f.o.ig) addBy("ig", nm, n.gluc*f.o.ig);
    addBy("fib", nm, n.fib); addBy("libW", nm, n.suc*f.lib*fac); if(f.o.ig) addBy("igW", nm, n.gluc*f.o.ig*fac);
    if(f.o.o3) addBy("o3", nm, it.g*f.o.o3); if(f.o.alc) addBy("alc", nm, it.g/f.o.alc);
    if(f.o.o3) t.o3 += it.g*f.o.o3;
    if(f.o.alc) t.verres += it.g/f.o.alc;
  }); });
  return t;
}

/* ---------- Score ---------- */
function contributions(x){
  // renvoie une liste {cle, libellé, effets}
  const out = [];
  const w = (x.marches||[]).reduce((t,m)=>t+walkMin(m)*INTENS[m.al||"n"],0) + x.piscine*1.3 + x.autre;
  const f = Math.min(w, 60)/60;
  if(w>0) out.push({k:"activite", l:"Activité physique ("+Math.round((x.marches||[]).reduce((t,m)=>t+walkMin(m),0)+x.piscine+x.autre)+" min)", e:{sucre:30*f, chol:12*f, reins:12*f}});
  const nr = (x.repas||[]).filter(Boolean).length;
  if(nr) out.push({k:"repas", l:"Marche après les repas", e:{sucre:4*nr}});
  const ml = eauMl(x);
  if(ml>0) out.push({k:"eau", l:"Eau ("+fmt(ml/1000,2)+" L, "+Math.round(ml/S.eau*100)+" % de l’objectif)", e:{reins:eauEffet(ml)}, note: ml<S.eau ? "Vous avez bu moins que votre objectif ("+fmt(S.eau,0)+" ml)" : ""});
  const meds = (x.med||[]).concat(x.n && x.n.bicarb ? [{id:"bicarb"}] : []).concat(x.n && x.n.ains ? [{id:"ains"}] : []);
  const cnt = {}; meds.forEach(m => cnt[m.id] = (cnt[m.id]||0)+1);
  for(const id in cnt){ const m = MEDMAP[id]; if(!m || !Object.keys(m.e).length) continue;
    const e = {}; for(const a in m.e) e[a] = m.e[a]*cnt[id];
    out.push({k:"med_"+id, l:m.l.replace(/ \(.*\)$/,"")+(cnt[id]>1?" ×"+cnt[id]:""), e, note:m.note}); }
  if(hasJournal(x)){
    // Journal des repas : calcul à partir des quantités
    const t = totals(x);
    const fb = Math.min(t.fib, LIM.fib)/LIM.fib;
    if(fb>0) out.push({k:"j_fib", l:"Fibres ("+Math.round(t.fib)+" g)", e:{sucre:12*fb, chol:8*fb}, dist:t.by.fib});
    if(t.o3>0) { const o = Math.min(t.o3/80, 1); out.push({k:"j_o3", l:"Poisson gras (oméga-3)", e:{chol:10*o, sucre:3*o}, dist:t.by.o3}); }
    // Pénalités calculées APRÈS l'effet de l'ordre du repas (sucre ralenti = compte moins)
    const penL = v => Math.max(0, v-LIM.lib)*0.6, penI = v => Math.max(0, v-60)*0.25;
    const ralenti = (brut, net) => brut-net >= 0.5 ? "🛡️ "+fmt(brut-net,0)+" g ralentis par l’ordre du repas (déjà déduits)" : "";
    if(penL(t.libW)>0) out.push({k:"j_suc", l:"Sucres ajoutés ("+Math.round(t.lib)+" g, repère "+LIM.lib+" g)", e:{sucre:-penL(t.libW)}, src:t.by.lib, dist:t.by.libW, u:"g de sucre ajouté", note:ralenti(t.lib,t.libW)});
    if(penI(t.igW)>0) out.push({k:"j_ig", l:"Glucides rapides ("+Math.round(t.igGluc)+" g, repère 60 g)", e:{sucre:-penI(t.igW)}, src:t.by.ig, dist:t.by.igW, u:"g de glucides rapides", note:ralenti(t.igGluc,t.igW)});
    if(t.kcal>S.kcal) { const d = (t.kcal-S.kcal)/100; out.push({k:"j_kcal", l:"Calories en trop ("+Math.round(t.kcal)+" kcal)", e:{sucre:-3*d, chol:-1*d}, src:t.by.kcal, dist:t.by.kcal, u:"kcal"}); }
    if(t.ags>LIM.ags) out.push({k:"j_ags", l:"Graisses saturées ("+Math.round(t.ags)+" g)", e:{chol:-(t.ags-LIM.ags)*1.2}, src:t.by.ags, dist:t.by.ags, u:"g de graisses saturées"});
    if(t.sel>LIM.sel) out.push({k:"j_sel", l:"Sel ("+fmt(t.sel,1)+" g)", e:{reins:-(t.sel-LIM.sel)*4}, src:t.by.sel, dist:t.by.sel, u:"g de sel"});
    if(t.verres>0) { const v = t.verres; out.push({k:"j_alc", l:"Alcool", e:{sucre:-5*v, chol:-2*v, reins:-4*v}, dist:t.by.alc}); }
    return out;
  }
  PLUS.forEach(it => { if(x.p[it.id]) out.push({k:it.id, l:it.l, e:it.e}); });
  MOINS.forEach(it => {
    const n = Math.max(0, (x.m[it.id]||0) - (it.free||0));
    if(n){ const e = {}; for(const a in it.e) e[a] = it.e[a]*n; out.push({k:it.id, l:it.l, e}); }
  });
  if(x.avocat) out.push({k:"avocat", l:x.avocat===1?"Avocat entier":"Demi-avocat", e:AVOCAT[x.avocat]});
  return out;
}
function score(x){
  const r = Object.assign({}, BASE);
  contributions(x).forEach(c => { for(const a in c.e) r[a] += c.e[a]; });
  for(const a in r) r[a] = clamp(r[a]);
  r.global = clamp((r.sucre + r.chol + r.reins)/3);
  return r;
}
function avg(from, n){
  // moyenne sur n jours se terminant à 'from' (inclus), jours renseignés seulement
  const acc = {sucre:0, chol:0, reins:0, global:0}; let c = 0;
  for(let i=0;i<n;i++){ const s = addDays(from, -i); if(hasData(D[s])){ const r = score(day(s)); for(const a in acc) acc[a]+=r[a]; c++; } }
  if(!c) return null;
  for(const a in acc) acc[a] = acc[a]/c;
  acc.n = c; return acc;
}

function stepper(path, v, step, unit=""){
  return `<div class="stepper"><button data-step="${path}" data-d="${-step}">−</button><span class="v">${v}${unit}</span><button data-step="${path}" data-d="${step}">+</button></div>`;
}
function tog(path, on, neg=false){ return `<button class="tog ${neg?"neg":""} ${on?"on":""}" data-tog="${path}" aria-pressed="${on}"></button>`; }

/* Anneau de score (style montre connectée) */
function ring(v, col, extra){
  const r = 34, c = 2*Math.PI*r, p = Math.max(0, Math.min(100, v))/100;
  return `<svg class="ring" viewBox="0 0 84 84" width="84" height="84"><circle cx="42" cy="42" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="9"/>
    <circle cx="42" cy="42" r="${r}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 42 42)" style="filter:drop-shadow(0 0 4px ${col})"/>
    <text x="42" y="${extra?46:49}" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">${Math.round(v)}</text>${extra?`<text x="42" y="62" text-anchor="middle" font-size="12" fill="${col}">${extra}</text>`:""}</svg>`;
}

  };

/* ---------- Détail d'un score : points par aliment et par activité ---------- */
function detail(x, axe){
  const pts = {}, raisons = {};
  const add = (nom, v, why) => { if(Math.abs(v)<0.05) return; pts[nom] = (pts[nom]||0) + v; if(why){ raisons[nom] = raisons[nom]||{}; raisons[nom][why] = (raisons[nom][why]||0) + v; } };
  contributions(x).forEach(c => {
    const v = (c.e||{})[axe]; if(!v) return;
    const why = c.l.replace(/ \(.*\)$/,"").replace(/ ×\d+$/,"");
    if(c.dist && Object.keys(c.dist).length){
      const tot = Object.values(c.dist).reduce((a,b)=>a+b,0);
      if(tot>0){ for(const n in c.dist) add(n, v*c.dist[n]/tot, why); return; }
    }
    add(c.l, v, "");
  });
  return Object.entries(pts).map(([n,v]) => ({n, v, r: Object.entries(raisons[n]||{}).filter(([,w])=>Math.abs(w)>=0.05)})).sort((a,b)=>b.v-a.v);
}
/* Repères affichés même quand ils ne coûtent aucun point */
function reperes(x, axe){
  const out = [], jr = hasJournal(x), t = jr ? totals(x) : null;
  const g = (v,d=0) => fmt(v,d)+" g";
  if(axe==="reins"){
    const ml = eauMl(x);
    out.push(["Eau", ml ? fmt(ml,0)+" ml / objectif "+fmt(S.eau,0)+" ml "+(ml>=S.eau?"✅":"(sous l’objectif)") : "pas encore saisie : notez-la dans Saisie → Eau", ml ? ml>=S.eau : null]);
    if(jr) out.push(["Sel", g(t.sel,1)+" / repère 6 g "+(t.sel<=LIM.sel?"✅":"(dépassé)"), t.sel<=LIM.sel]);
    if(!(x.med||[]).some(m => MEDMAP[m.id] && Object.keys(MEDMAP[m.id].e).length)) out.push(["Médicaments qui fatiguent les reins", "aucun ✅", true]);
  }
  if(axe==="sucre" && jr){
    out.push(["Sucres ajoutés", g(t.libW)+" / repère 25 g "+(t.libW<=LIM.lib?"✅":"(dépassé)"), t.libW<=LIM.lib]);
    out.push(["Glucides rapides", g(t.igW)+" / repère 60 g "+(t.igW<=60?"✅":"(dépassé)"), t.igW<=60]);
    out.push(["Calories", fmt(t.kcal,0)+" / "+fmt(S.kcal,0)+" kcal "+(t.kcal<=S.kcal?"✅":"(dépassé)"), t.kcal<=S.kcal]);
  }
  if(axe==="chol" && jr){
    out.push(["Graisses saturées", g(t.ags)+" / repère 18 g "+(t.ags<=LIM.ags?"✅":"(dépassé)"), t.ags<=LIM.ags]);
    out.push(["Poisson gras", t.o3>0 ? g(t.o3)+" / repère 80 g "+(t.o3>=80?"✅":"") : "aucun aujourd’hui", t.o3>=80 ? true : null]);
    out.push(["Fibres", g(t.fib)+" / objectif 25 g "+(t.fib>=LIM.fib?"✅":""), t.fib>=LIM.fib ? true : null]);
  }
  if(!jr && axe!=="reins") out.push(["Repas", "notez-les dans l’onglet Saisie pour le détail", null]);
  return out;
}
function detailSemaine(axe){
  const t = today(), acc = {}, why = {}; let n = 0, sc = 0;
  for(let i=0;i<7;i++){ const s = addDays(t,-i); if(!hasData(D[s])) continue; const x = day(s); n++; sc += score(x)[axe];
    detail(x, axe).forEach(it => { const k = it.n.replace(/ \(.*\)$/,"").replace(/ ×\d+$/,"");
      acc[k] = (acc[k]||0) + it.v; why[k] = why[k]||{}; it.r.forEach(([w,v]) => why[k][w] = (why[k][w]||0)+v); }); }
  if(!n) return {n:0, list:[], score:0};
  return {n, score:Math.round(sc/n), list:Object.entries(acc).map(([k,v]) => ({n:k, v:v/n, r:Object.entries(why[k]).map(([w,v2])=>[w,v2/n]).filter(([,v2])=>Math.abs(v2)>=0.05)})).filter(i=>Math.abs(i.v)>=0.05).sort((a,b)=>b.v-a.v)};
}

      <b style="color:${i.v>0?"var(--good)":"var(--bad)"};white-space:nowrap">${pt(i.v)}</b></div>`;
  const plus = list.filter(i=>i.v>0), moins = list.filter(i=>i.v<0).sort((a,b)=>a.v-b.v);

  <div class="body"><div class="card" style="margin-top:12px">
    <div class="row"><div class="lbl">Point de départ<small>journée moyenne</small></div><b>${BASE[axe]}</b></div>
    ${plus.length?`<h3 style="color:var(--good)">Font monter</h3>${plus.map(ligne).join("")}`:""}

    ${!list.length?`<p class="muted">Rien n’a encore modifié ce score aujourd’hui.</p>`:""}
    ${semaine ? `<p class="muted" style="margin:10px 0 0">Points moyens par jour, sur ${ws.n} jour${ws.n>1?"s":""} renseigné${ws.n>1?"s":""}. Pour le détail d’une journée précise, touchez le score dans le Tableau de bord.</p>` : ""}
    ${semaine ? "" : (()=>{ const rp = reperes(x, axe); return rp.length ? `<h3>Repères du jour</h3>${rp.map(([l,v,ok])=>`<div class="row"><div class="lbl">${l}</div><span style="color:${ok===true?"var(--good)":ok===false?"var(--bad)":"var(--warn)"};text-align:right">${v}</span></div>`).join("")}` : ""; })()}
    <div class="row" style="border-top:2px solid var(--line);margin-top:6px"><div class="lbl"><b>${semaine?"Moyenne de la semaine":"Score du jour"}</b>
      ${brut>100||brut<0?`<small>${fmt(BASE[axe],0)} ${somme>=0?"+":"−"} ${Math.round(Math.abs(somme))} = ${Math.round(brut)}, ramené entre 0 et 100</small>`:`<small>${BASE[axe]} ${somme>=0?"+":"−"} ${fmt(Math.abs(somme),0)}</small>`}</div>
      <b style="font-size:22px;color:${n.c}">${r[axe]}</b></div>
    <p class="muted" style="margin:10px 0 0">Les points d’un aliment regroupent tout ce qu’il apporte (sucres, sel, graisses, fibres…), après l’effet de l’ordre du repas.</p>
  </div></div>`;
  ov.classList.add("on");
  document.getElementById("ovx").onclick = closeOv;

/* ---------- Journal des repas ---------- */
function nutBar(label, v, lim, unit, dec=0, goodIfAbove=false){
  const pct = Math.min(100, Math.round(v/lim*100));
  const over = goodIfAbove ? false : v>lim;
  return `<span>${label}</span><span><b>${fmt(v,dec)}</b> / ${goodIfAbove?"":"max "}${fmt(lim,0)} ${unit}</span><div class="bar ${over?"over":""}"><i style="width:${pct}%${goodIfAbove?";background:var(--good)":""}"></i></div>`;
}
function lastMeal(m){
  for(let i=1;i<=14;i++){ const s = addDays(cur,-i); const d = D[s];
    if(d && d.j && d.j[m] && d.j[m].length) return {items:d.j[m], lbl: i===1 ? "d’hier" : "de "+parse(s).toLocaleDateString("fr-FR",{weekday:"long", day:"numeric"})}; }
  return null;
}
function mealHTML(x, m){

  return items.map((it,i) => { const f = FOODS[it.f]; if(!f) return ""; const n = nutr(f,it.g);

    + `<button class="add" data-addm="${m}">+ Ajouter un aliment</button>`
    + (!items.length && lastMeal(m) ? `<button class="add" style="background:var(--card2)" data-copym="${m}">↺ Reprendre celui ${esc(lastMeal(m).lbl)}</button>` : "");
}

/* Lignes du total : d'où vient chaque nutriment */
const NUTS = ["kcal","lib","ags","sel","fib"];
const NUTDEF = {
  kcal:{l:"Calories", u:"kcal", dec:0, lim:()=>S.kcal, tot:t=>t.kcal, val:(f,n)=>n.kcal},
  lib:{l:"Sucres ajoutés", u:"g", dec:0, lim:()=>LIM.lib, tot:t=>t.lib, val:(f,n)=>n.suc*f.lib},
  ags:{l:"Graisses saturées", u:"g", dec:0, lim:()=>LIM.ags, tot:t=>t.ags, val:(f,n)=>n.ags},
  sel:{l:"Sel", u:"g", dec:1, lim:()=>LIM.sel, tot:t=>t.sel, val:(f,n)=>n.sel},
  fib:{l:"Fibres (objectif)", u:"g", dec:0, lim:()=>LIM.fib, tot:t=>t.fib, val:(f,n)=>n.fib, obj:true}
};
function openNutri(k){
  const d = NUTDEF[k], x = day(cur), t = totals(x), tot = d.tot(t), lim = d.lim();
  const rows = [];
  MEALS.forEach(([m,label]) => (x.j[m]||[]).forEach(it => { const f = FOODS[it.f]; if(!f) return; const v = d.val(f, nutr(f,it.g)); if(v>=0.05) rows.push({n:f.n, m:label, g:it.g, v}); }));
  rows.sort((a,b)=>b.v-a.v);
  const dec = d.dec || (k==="sel"?1:0);
  const depasse = !d.obj && tot>lim;
  document.body.style.overflow = "hidden";

let zxLoad = null;
function loadZX(){
  if(window.ZXing) return Promise.resolve();
  if(!zxLoad) zxLoad = new Promise((ok, ko) => { const sc = document.createElement("script"); sc.src = "/zxing.min.js"; sc.onload = ok; sc.onerror = () => { zxLoad = null; ko(); }; document.head.appendChild(sc); });
  return zxLoad;
}
function decodeImage(file){
  return loadZX().then(() => new Promise((ok, ko) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const hints = new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E]);
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
      const reader = new ZXing.MultiFormatReader(); reader.setHints(hints);
      const essais = [];
      [1400, 900, 2000].forEach(max => [0, 90].forEach(rot => essais.push([max, rot])));
      for(const [max, rot] of essais){
        const k = Math.min(1, max/Math.max(img.width, img.height));
        const w = Math.round(img.width*k), h = Math.round(img.height*k);
        const cv = document.createElement("canvas"); cv.width = rot ? h : w; cv.height = rot ? w : h;
        const cx = cv.getContext("2d");
        if(rot){ cx.translate(h, 0); cx.rotate(Math.PI/2); }
        cx.drawImage(img, 0, 0, w, h);
        try{
          const bmp = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(cv)));
          const r = reader.decode(bmp); URL.revokeObjectURL(url); ok(r.getText()); return;
        }catch(e){}
      }
      URL.revokeObjectURL(url); ko(new Error("illisible"));
    };
    img.onerror = () => ko(new Error("image"));
    img.src = url;
  }));
}
function fetchOFF(code){
  const champs = "product_name,product_name_fr,brands,quantity,serving_size,nutriments,ingredients_text,ingredients_text_fr,categories_tags";
  return fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=${champs}`)
    .then(r => r.json()).then(j => {
      if(!j || j.status!==1 || !j.product) return null;
      const p = j.product, n = p.nutriments||{};
      const v = k => { const x = n[k+"_100g"]; return x==null || x==="" ? "" : Math.round(+x*100)/100; };
      let kcal = v("energy-kcal"); if(kcal==="" && n["energy_100g"]!=null) kcal = Math.round(n["energy_100g"]/4.184);
      let sel = v("salt"); if(sel==="" && n["sodium_100g"]!=null) sel = Math.round(n["sodium_100g"]*2.5*100)/100;
      const nom = (p.product_name_fr || p.product_name || "Produit "+code).trim();
      const marque = (p.brands||"").split(",")[0].trim();
      const q = String(p.serving_size || p.quantity || "");
      const mq = q.replace(",",".").match(/(\d+(?:\.\d+)?)\s*(g|ml)\b/i);
      const pg = mq && +mq[1] <= 600 ? Math.round(+mq[1]) : 100;
      const ingr = (p.ingredients_text_fr || p.ingredients_text || "").toLowerCase();
      const cats = (p.categories_tags||[]).join(" ");
      const txt = (nom+" "+cats).toLowerCase();
      return { code, n: marque && !nom.toLowerCase().includes(marque.toLowerCase()) ? nom+" – "+marque : nom,
        kcal, lip:v("fat"), ags:v("saturated-fat"), gluc:v("carbohydrates"), suc:v("sugars"), fib:v("fiber"), prot:v("proteins"), sel,
        pl: p.serving_size ? "1 portion" : "1 paquet / boîte", pg,
        o3: /sardin|maquereau|mackerel|saumon|salmon|hareng|herring|anchois|anchov|truite|trout/.test(txt),
        lib: /sucre|sirop|miel|dextrose|glucose|fructose|saccharose|caramel/.test(ingr),
        ig: (+v("carbohydrates")||0) >= 30 && (+v("fiber")||0) < 6, source:"Open Food Facts" };
    });
}

      if(!g){ alert("Indiquez une quantité."); return; }
      editJ(x => { x.j[meal] = x.j[meal]||[]; if(idx>=0) x.j[meal][idx] = {f:fid, g}; else x.j[meal].push({f:fid, g}); });
      S.recents = [fid].concat((S.recents||[]).filter(id=>id!==fid)).slice(0,8); save();
      render(); openMeal(meal);
    };
    const mv = d => { editJ(x => { const a = x.j[meal]; const j = idx+d; if(j<0||j>=a.length) return; [a[idx],a[j]] = [a[j],a[idx]]; }); render(); openMeal(meal); };
    if(idx>=0){ document.getElementById("mvUp").onclick = () => mv(-1); document.getElementById("mvDn").onclick = () => mv(1); }
    if(idx>=0) document.getElementById("del").onclick = () => { editJ(x => { x.j[meal].splice(idx,1); }); render(); openMeal(meal); };
  };
  draw();
}
function editJ(fn){
  const x = day(cur); x.j = x.j||{}; fn(x); syncMarche(x);
  if(hasData(x)) D[cur] = x; else delete D[cur];
  save();
}

function factorList(list){
  const tot = list.map(c => ({l:c.l, v:Object.values(c.e).reduce((s,v)=>s+v,0), e:c.e, src:c.src, u:c.u, note:c.note, parJour:c.parJour})).filter(c=>Math.abs(c.v)>=0.5);
  const causes = c => {
    const noteHtml = c.note ? `<small style="color:var(--good);margin-top:3px">${c.note.startsWith("🛡️")?"":"👉 "}${esc(c.note)}</small>` : "";
    if(!c.src) return noteHtml ? noteHtml.replace("var(--good)","var(--ink)") : "";
    const arr = Object.entries(c.src).sort((a,b)=>b[1]-a[1]); const total = arr.reduce((t,x)=>t+x[1],0);
    const top = arr.filter(x => x[1] >= total*0.08).slice(0,4);
    if(!top.length) return "";
    const dec = c.u==="g de sel" ? 1 : 0;
    return `<small style="color:var(--ink);margin-top:3px">👉 Surtout : ${top.map(([n,v])=>`<b>${esc(n)}</b> (${fmt(v,dec)} ${c.u.split(" ")[0]})`).join(", ")}${c.parJour?" <span class='muted'>en moyenne par jour</span>":""}</small>${c.parJour?"":noteHtml}`;
  };
  const pos = tot.filter(c=>c.v>0).sort((a,b)=>b.v-a.v).slice(0,4);
  const neg = tot.filter(c=>c.v<0).sort((a,b)=>a.v-b.v).slice(0,4);
  const force = v => { const a = Math.abs(v); return a>=10 ? "●●●" : a>=4 ? "●●○" : "●○○"; };
  const NOMS = {sucre:"la glycémie", chol:"le cholestérol", reins:"les reins"};
  const line = c => {
    const ax = Object.keys(c.e).filter(a => Math.abs(c.e[a])>=0.3).sort((a,b)=>Math.abs(c.e[b])-Math.abs(c.e[a]));
    const good = c.v>0;
    return `<div class="row"><div class="lbl">${esc(c.l)}<small>${good?"Bon pour":"Mauvais pour"} : ${ax.map(a=>`${NOMS[a]} <span style="color:${good?"var(--good)":"var(--bad)"};letter-spacing:1px">${force(c.e[a])}</span>`).join(" · ")}</small>${good?"":causes(c)}</div></div>`;
  };
  return `<p class="muted" style="margin:0">Effet : ●○○ léger · ●●○ moyen · ●●● fort</p>`
       + (pos.length?`<h3 style="color:var(--good)">Vous rapproche</h3>${pos.map(line).join("")}`:"")
       + (neg.length?`<h3 style="color:var(--bad)">Vous éloigne</h3>${neg.map(line).join("")}`:"")
       ;
}

function verdict(now, before, label){
  if(!now) return `<div class="verdict flat"><span class="ic">✍️</span><div>Pas encore de données cette semaine.</div></div>`;
  if(!before) return `<div class="verdict flat"><span class="ic">⏳</span><div>Moyenne ${label} : <b>${Math.round(now)}</b>. Il faut une semaine de plus pour comparer.</div></div>`;
  const d = now - before;
  if(d > 3) return `<div class="verdict good"><span class="ic">↗️</span><div><b>Vous vous rapprochez de l’objectif</b><br>${Math.round(before)} → ${Math.round(now)} par rapport à la semaine d’avant.</div></div>`;
  if(d < -3) return `<div class="verdict bad"><span class="ic">↘️</span><div><b>Vous vous éloignez de l’objectif</b><br>${Math.round(before)} → ${Math.round(now)} par rapport à la semaine d’avant.</div></div>`;
  return `<div class="verdict flat"><span class="ic">➡️</span><div><b>Stable</b><br>${Math.round(before)} → ${Math.round(now)} par rapport à la semaine d’avant.</div></div>`;
}

/* Courbe arrondie avec un visage par jour */
let chartAxe = "sucre";
function courbe(axe){
  const t = today();
  const filled = Object.keys(D).filter(k => k<=t && k>addDays(t,-30) && hasData(D[k])).sort();
  if(filled.length<2) return `<p class="muted" style="margin:0">La courbe apparaîtra dès <b>2 jours</b> remplis (${filled.length} pour l’instant).</p>`;
  const N = Math.max(7, Math.min(30, Math.round((parse(t)-parse(filled[0]))/864e5)+1));
  const W = 340, H = 220, P = {l:12, r:12, t:34, b:30};
  const vals = filled.filter(k => k>addDays(t,-N)).map(k => score(day(k))[axe]);
  const lo = Math.max(0, Math.min(40, Math.floor((Math.min(...vals)-10)/10)*10));
  const X = i => P.l + i*(W-P.l-P.r)/(N-1), Y = v => P.t + (100-v)*(H-P.t-P.b)/(100-lo);
  const pts = [];
  for(let i=N-1;i>=0;i--){ const s = addDays(t,-i); if(hasData(D[s])) pts.push({x:X(N-1-i), y:Y(score(day(s))[axe]), v:score(day(s))[axe], s}); }
  // courbe lissée (Catmull-Rom → Bézier)
  let d = `M${pts[0].x},${pts[0].y}`;
  for(let i=0;i<pts.length-1;i++){
    const p0 = pts[i-1]||pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2]||p2;
    const c1x = p1.x+(p2.x-p0.x)/6, c1y = p1.y+(p2.y-p0.y)/6, c2x = p2.x-(p3.x-p1.x)/6, c2y = p2.y-(p3.y-p1.y)/6;
    d += ` C${c1x},${Math.min(H-P.b,Math.max(P.t,c1y))} ${c2x},${Math.min(H-P.b,Math.max(P.t,c2y))} ${p2.x},${p2.y}`;
  }
  const aire = d + ` L${pts[pts.length-1].x},${H-P.b} L${pts[0].x},${H-P.b} Z`;
  const pas = (W-P.l-P.r)/(N-1), fs = Math.max(11, Math.min(20, pas*0.95));
  const visage = v => v>=70 ? "😃" : v>=50 ? "😐" : "😟";
  const y70 = Y(70);
  const last = pts[pts.length-1], nl = niveau(last.v);
  const svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;border-radius:16px" role="img" aria-label="Évolution du score ${AXES[axe].nom}">
    <defs>
      <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2f5e"/><stop offset="1" stop-color="#0b1428"/></linearGradient>
      <linearGradient id="aire" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5eead4" stop-opacity=".45"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></linearGradient>
    </defs>
    <rect x="0" y="0" width="${W}" height="${H}" fill="url(#fond)"/>
    <line x1="${P.l}" x2="${W-P.r}" y1="${y70}" y2="${y70}" stroke="#a7f3d0" stroke-opacity=".55" stroke-dasharray="4 4"/>
    <path d="${aire}" fill="url(#aire)"/>
    <path d="${d}" fill="none" stroke="#99f6e4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map(p => `<g data-pt="${p.s}|${p.v}" style="cursor:pointer">
      <rect x="${p.x-pas/2}" y="0" width="${pas}" height="${H}" fill="transparent"/>
      <text x="${p.x}" y="${p.y-10}" font-size="${fs}" text-anchor="middle">${visage(p.v)}</text>
      <circle cx="${p.x}" cy="${p.y}" r="5" fill="#ffffff" stroke="#14b8a6" stroke-width="3"/></g>`).join("")}
    ${[[0,addDays(t,-(N-1))],[N-1,t]].map(([i,s],j)=>`<text x="${X(i)}" y="${H-10}" font-size="10" fill="#ccfbf1" text-anchor="${j?"end":"start"}">${parse(s).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}</text>`).join("")}
  </svg>`;
  return svg + `<p id="ptInfo" class="muted" style="margin:8px 0 0">${esc(parse(last.s).toLocaleDateString("fr-FR",{weekday:"long", day:"numeric", month:"long"}))} : <b style="color:${nl.c}">${last.v}</b> · ${nl.t}</p>
    <p class="muted" style="margin:4px 0 0;font-size:13px">😃 70 et plus · 😐 50 à 69 · 😟 moins de 50 · pointillés : objectif 70. Touchez un jour pour voir sa note.</p>`;
}
function chart(){
  const W = 340, H = 170, P = {l:28, r:8, t:8, b:22};
  const t = today(), pts = {sucre:[], chol:[], reins:[]};
  const filled = Object.keys(D).filter(k => k<=t && hasData(D[k])).sort();
  const nb = filled.filter(k => k>addDays(t,-30)).length;
  if(nb<3) return `<p class="muted" style="margin:0">La courbe apparaîtra quand vous aurez rempli <b>au moins 3 jours</b> (${nb} pour l’instant). Elle montrera alors si vos scores montent vers l’objectif de 70.</p>`;
  const N = Math.max(7, Math.min(30, Math.round((parse(t)-parse(filled.find(k=>k>addDays(t,-30))))/864e5)+1));
  for(let i=N-1;i>=0;i--){ const s = addDays(t,-i); const x = N-1-i;
    if(hasData(D[s])){ const r = score(day(s)); for(const k in pts) pts[k].push([x, r[k]]); } }
  const X = i => P.l + i*(W-P.l-P.r)/(N-1), Y = v => P.t + (100-v)*(H-P.t-P.b)/100;
  let g = "";
  [0,50,100].forEach(v => g += `<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e2e8e6"/><text x="${P.l-5}" y="${Y(v)+4}" font-size="10" text-anchor="end" fill="#5f6b76">${v}</text>`);
  g += `<line x1="${P.l}" x2="${W-P.r}" y1="${Y(70)}" y2="${Y(70)}" stroke="#94a3b8" stroke-dasharray="4 3"/>`;
  [[0,addDays(t,-(N-1))],[N-1,t]].forEach(([i,s],j)=> g += `<text x="${X(i)}" y="${H-6}" font-size="10" fill="#5f6b76" text-anchor="${j?"end":"start"}">${parse(s).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}</text>`);
  for(const k in pts){
    const p = pts[k]; if(!p.length) continue;
    g += `<polyline fill="none" stroke="${AXES[k].hex}" stroke-width="2" stroke-linejoin="round" points="${p.map(([x,v])=>X(x)+","+Y(v)).join(" ")}"/>`;
    p.forEach(([x,v]) => g += `<circle cx="${X(x)}" cy="${Y(v)}" r="2.5" fill="${AXES[k].hex}"/>`);
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Scores des 30 derniers jours">${g}</svg>`;
}

let labForm = false;
function rAnalyses(){
  const sorted = L.slice().sort((a,b)=>a.date<b.date?-1:1);
  const last = sorted[sorted.length-1];
  const next = last ? addDays(last.date, 90) : null;
  const rows = LABS.map(m => {
    const vals = sorted.filter(e => e[m.id]!=null && e[m.id]!=="");
    if(!vals.length) return "";
    const v = vals[vals.length-1][m.id], p = vals.length>1 ? vals[vals.length-2][m.id] : null;
    const c = m.cible();
    let ok = "";
    if(c!=null) ok = (m.bas ? v < c : v > c) ? "✅" : "⚠️";
    let tr = "";
    if(p!=null && v!==p){ const better = m.bas ? v<p : v>p; tr = `<span class="${better?"up":"down"}">${better?"mieux":"moins bien"}</span>`; }
    return `<tr><td>${m.l}<div class="muted">${p!=null?fmt(p)+" → ":""}<b>${fmt(v)}</b> ${m.u}</div></td><td>${m.ct()} ${ok}</td><td>${tr}</td></tr>`;
  }).join("");
  app.innerHTML = `
  <div class="card">
    <h2>🩸 Mes résultats</h2>
    ${rows ? `<table><tr><th>Marqueur</th><th>Objectif</th><th>Évolution</th></tr>${rows}</table>
      <p class="muted">Dernier bilan : ${fmtShort(last.date)}. Prochain bilan conseillé vers le <b>${fmtShort(next)}</b> (environ 3 mois), sur prescription du médecin.</p>`
    : `<p class="muted">Aucun résultat enregistré. Ajoutez votre dernière prise de sang, ou importez le fichier de vos analyses depuis Réglages.</p>`}
    <button class="btn" id="addLab">${labForm?"Annuler":"Ajouter une prise de sang"}</button>
  </div>
  ${labForm ? `<div class="card" id="lf">
    <h2>Nouvelle prise de sang</h2>
    <label class="f">Date <input type="date" id="ld" value="${today()}"></label>
    ${LABS.map(m=>`<label class="f">${m.l}${m.u?` (${m.u})`:""} <input type="text" inputmode="decimal" data-lab="${m.id}"></label>`).join("")}
    <p class="muted">Laissez vide ce qui n’a pas été mesuré.</p>
    <button class="btn" id="saveLab">Enregistrer</button>
  </div>` : ""}
  ${sorted.length ? `<div class="card"><h2>Historique</h2>
    ${sorted.slice().reverse().map((e,i)=>`<div class="row"><div class="lbl"><b>${fmtShort(e.date)}</b><small>${LABS.filter(m=>e[m.id]!=null&&e[m.id]!=="").map(m=>m.l.split(" ")[0]+" "+fmt(e[m.id])).join(" · ")}</small></div><button class="chip" data-del="${esc(e.date)}">Suppr.</button></div>`).join("")}
  </div>` : ""}`;
  document.getElementById("addLab").onclick = () => { labForm = !labForm; render(); };
  if(labForm) document.getElementById("saveLab").onclick = () => {
    const e = {date: document.getElementById("ld").value || today()};
    app.querySelectorAll("[data-lab]").forEach(i => { const v = i.value.replace(",","."); if(v!=="" && !isNaN(+v)) e[i.dataset.lab] = +v; });
    if(Object.keys(e).length<2){ alert("Saisissez au moins une valeur."); return; }
    L = L.filter(x => x.date!==e.date).concat([e]); save(); labForm = false; render();
  };
  app.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    if(confirm("Supprimer la prise de sang du "+fmtShort(b.dataset.del)+" ?")){ L = L.filter(x=>x.date!==b.dataset.del); save(); render(); }
  });
}

function rReglages(){
  app.innerHTML = `
  <div class="card">
    <h2>Objectifs</h2>
    <label class="f">Sexe <select id="ssexe"><option value="H" ${S.sexe!=="F"?"selected":""}>Homme</option><option value="F" ${S.sexe==="F"?"selected":""}>Femme</option></select></label>
    <p class="muted" style="margin:0">Sert aux seuils du HDL et du tour de taille.</p>
    <label class="f">Objectif LDL (g/l)
      <select id="sldl">${[[1.16,"< 1,16 (faible)"],[1.00,"< 1,00 (modéré)"],[0.70,"< 0,70 (élevé)"],[0.55,"< 0,55 (très élevé)"]].map(([v,t])=>`<option value="${v}" ${S.ldl===v?"selected":""}>${t}</option>`).join("")}</select></label>
    <p class="muted" style="margin:0">À confirmer avec votre médecin selon votre risque cardiovasculaire.</p>
    <label class="f">Activité par semaine (min) <input type="number" inputmode="numeric" id="sact" value="${S.actif}"></label>
    <label class="f">Calories par jour (kcal) <input type="number" inputmode="numeric" id="skcal" value="${S.kcal}"></label>
    <p class="muted" style="margin:0">À fixer avec votre médecin ou un diététicien : il dépend de l’âge, du poids et de l’activité.</p>
    <label class="f">Objectif d’eau (ml) <input type="number" inputmode="numeric" id="seau" value="${S.eau}"></label>
    <p class="muted" style="margin:0">Augmentez-le petit à petit, par exemple de 100 ml toutes les 2 semaines, jusqu’à 1 500 ml, sauf avis médical contraire.</p>
  </div>
  <div class="card">
    <h2>Mes produits</h2>
    ${(S.perso||[]).length ? S.perso.map(p=>`<div class="row"><div class="lbl">${esc(p.n)}<small>${Math.round(p.kcal)} kcal · sat. ${fmt(p.ags,1)} g · sucres ${fmt(p.suc,1)} g · sel ${fmt(p.sel,2)} g (pour 100 g)</small></div><button class="chip" data-delp="${esc(p.id)}">Suppr.</button></div>`).join("")
      : `<p class="muted" style="margin:0">Aucun pour l’instant. Ajoutez-en depuis Saisie → un repas → Ajouter un aliment → 📷 Scanner ou ✏️ Saisir une étiquette.</p>`}
  </div>
  <div class="card">
    <h2>Sauvegarde</h2>
    <p class="muted" style="margin:0">Vos données restent uniquement sur ce téléphone. Exportez-les de temps en temps.</p>
    <button class="btn" id="exp">Exporter mes données</button>
    <button class="btn sec" id="imp">Importer un fichier</button>
    <button class="btn danger" id="rst">Tout effacer</button>
  </div>
  <div class="card">
    <h2>Comment est calculé le score ?</h2>
    <p class="muted">Chaque jour part d’une base, puis l’activité et les aliments ajoutent ou retirent des points sur trois lignes : Glycémie, Cholestérol et Reins. L’activité compte surtout pour la glycémie ; les graisses animales pour le cholestérol ; le sel, l’eau et certains médicaments (bicarbonate, anti-inflammatoires, magnésium) pour les reins.</p>
    <p class="muted">C’est un indicateur d’habitudes pour vous motiver, pas une mesure médicale. Il ne remplace ni la prise de sang ni l’avis de votre médecin.</p>
    <p class="muted">Si vous détaillez vos repas dans l’onglet Saisie, le calcul se fait à partir des quantités : calories, sucres ajoutés (définition de l’OMS : pas ceux des fruits entiers ni du lait nature), glucides rapides, graisses saturées, sel, fibres et poisson gras. Le sucré mangé après des légumes et des protéines compte moins (ordre du repas). Sinon, c’est la liste rapide qui compte.</p>
    <p class="muted">Version 36</p>
  </div>`;
  document.getElementById("sldl").onchange = e => { S.ldl = +e.target.value; save(); };
  document.getElementById("ssexe").onchange = e => { S.sexe = e.target.value; save(); };
  document.getElementById("sact").onchange = e => { const v = parseInt(e.target.value); if(v>0){ S.actif = v; save(); } };
  document.getElementById("seau").onchange = e => { const v = parseInt(e.target.value); if(v>=300 && v<=4000){ S.eau = v; save(); } };
  document.getElementById("skcal").onchange = e => { const v = parseInt(e.target.value); if(v>=1000){ S.kcal = v; save(); } };
  document.getElementById("exp").onclick = exporter;
  app.querySelectorAll("[data-delp]").forEach(b => b.onclick = () => { const p = S.perso.find(x=>x.id===b.dataset.delp);
    if(p && confirm("Supprimer « "+p.n+" » de Mes produits ?")){ S.perso = S.perso.filter(x=>x.id!==p.id); save(); registerPerso(); render(); } });
  document.getElementById("imp").onclick = () => document.getElementById("fileIn").click();
  document.getElementById("rst").onclick = () => { if(confirm("Effacer toutes les données de l’application ?") && confirm("Vraiment tout effacer ?")){ D = {}; L = []; save(); render(); } };
}

async function exporter(){
  const data = JSON.stringify({app:"capsante", version:1, days:D, labs:L, settings:S}, null, 1);
  const name = "cap-sante-"+today()+".json";
  const file = new File([data], name, {type:"application/json"});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); return; }
  }catch(e){ if(e.name==="AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
document.getElementById("fileIn").onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const j = JSON.parse(r.result); let n = 0;
      if(j.days && typeof j.days==="object"){ Object.assign(D, j.days); n++; }
      if(Array.isArray(j.labs)){ j.labs.forEach(e => { if(e && e.date){ L = L.filter(x=>x.date!==e.date).concat([e]); } }); n++; }
      if(j.settings && typeof j.settings==="object"){ Object.assign(S, j.settings); registerPerso(); n++; }
      if(!n) throw 0;
      save(); alert("Import réussi."); render();
    }catch(err){ alert("Ce fichier n’est pas reconnu."); }
    e.target.value = "";
  };
  r.readAsText(f);
};

render();

/* ---------- Mises à jour (service worker) ---------- */
if("serviceWorker" in navigator){
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if(!reloading){ reloading = true; location.reload(); } });
  navigator.serviceWorker.register("/sw.js").then(reg => {
    const show = w => {
      const u = document.getElementById("upd"), btn = document.getElementById("updBtn");
      u.style.display = "flex"; btn.disabled = false; btn.textContent = "Mettre à jour";
      btn.onclick = () => {
        btn.disabled = true; btn.textContent = "Mise à jour…";
        const target = reg.waiting || w;            // toujours la version la plus récente
        try{ if(target) target.postMessage("SKIP_WAITING"); }catch(e){}
        setTimeout(() => { if(!reloading){ reloading = true; location.reload(); } }, 1500);  // filet de sécurité
      };
    };
    if(reg.waiting && navigator.serviceWorker.controller) show(reg.waiting);
    reg.addEventListener("updatefound", () => {
      const w = reg.installing;
      w.addEventListener("statechange", () => { if(w.state==="installed" && navigator.serviceWorker.controller) show(w); });
    });
    document.addEventListener("visibilitychange", () => { if(document.visibilityState==="visible") reg.update(); });
  }).catch(()=>{});
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState==="visible" && tab==="jour" && cur!==today() && !D[cur]) { cur = today(); render(); } });
</script>
